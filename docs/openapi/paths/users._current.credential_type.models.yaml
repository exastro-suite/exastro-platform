get:
  tags:
    - UsersService
  summary: 使用可能なモデル一覧を取得
  description: 登録されたCredentialを使用して、AIサービスで利用可能なモデル一覧を取得する
  operationId: list_models
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
      description: AIサービスID(現在はbedrock-cacheとbedrockのみ対応)
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      models:
                        type: array
                        items:
                          $ref: '../schemas/modelInfo.yaml'
                      count:
                        type: integer
                        description: モデル数
                      credential_type:
                        type: string
                        description: AIサービスID
    400:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    403:
      description: |-
        AIアシスタント機能が有効になっていない
        The AI assistant feature is not enabled
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    404:
      description: Credentialが見つからない
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
