post:
  tags:
    - UsersService
  summary: Credentialを検証
  description: このcredential_typeに登録されているCredentialが有効かどうかを検証する
  operationId: verify_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
  responses:
    200:
      description: 検証結果
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      message:
                        type: string
                      account_id:
                        type: string
                        description: AWSアカウントID(Bedrockの場合)
                      user_id:
                        type: string
                        description: AWS User ID(Bedrockの場合)
    404:
      description: Credentialが見つからない
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
