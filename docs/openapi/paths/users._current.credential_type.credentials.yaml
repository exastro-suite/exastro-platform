post:
  tags:
    - UsersService
  summary: Credentialを登録
  description: 外部サービスのCredentialを登録する
  operationId: register_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
      description: |
        Credentialタイプ
        - bedrock-cache: AWS Login Cache (自動トークン更新、credential_data: {"apiKey": "<キャッシュファイル全体のJSON文字列>"})
        - bedrock: AWS Bedrock (手動Credential登録)
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - credential_name
            - credential_data
          properties:
            credential_name:
              type: string
              description: Credential名
              example: "My Bedrock Credential"
            credential_data:
              type: object
              description: |
                Credentialデータ(JSON形式、サービスごとに異なる。キー名はGET /ai-servicesのsettingsで定義される)

                bedrock-cache の例(apiKeyの値は ~/.aws/login/cache/*.json の内容全体をJSON文字列化したもの):
                  {"apiKey": "{\"idToken\":\"...\",\"accessToken\":\"...\",\"refreshToken\":\"...\",\"region\":\"ap-northeast-1\"}"}

                bedrock の例(regionは必須。フォールバックのデフォルト値は無いため、未指定の場合はAWS呼び出し時にエラーとなる):
                  {
                    "accessKeyId": "ASIA...",
                    "secretAccessKey": "...",
                    "sessionToken": "...",
                    "region": "ap-northeast-1"
                  }
              example:
                accessKeyId: "ASIA..."
                secretAccessKey: "..."
                sessionToken: "..."
                region: "ap-northeast-1"
            notes:
              type: string
              description: 備考
  responses:
    200:
      description: 登録成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      credential_type:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
    400:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    409:
      description: |
        既にこのcredential_typeでCredentialが登録済み(1credential_typeにつき1件のみ登録可能。更新はPUTを使用する)
        A credential is already registered for this credential_type (only one credential is allowed per credential_type; use PUT to update it)
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    500:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

get:
  tags:
    - UsersService
  summary: Credentialを取得
  description: |
    このcredential_typeに登録されているCredentialを取得する(1credential_typeにつき1件のみ)。
    credential_dataのうち、GET /ai-servicesのsettingsでtype: password以外と定義されている項目のみ
    値を返す(passwordタイプの項目は値を返さずマスクする)。未登録の場合も404にはせず、
    credential_id等がnullの状態で200を返す。
  operationId: get_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
  responses:
    200:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                        nullable: true
                      credential_type:
                        type: string
                      credential_name:
                        type: string
                        nullable: true
                      status:
                        type: string
                        nullable: true
                      expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      last_used_at:
                        type: string
                        format: date-time
                        nullable: true
                      credential_data_keys:
                        type: array
                        items:
                          type: string
                        description: |-
                          Credentialデータに含まれるキー一覧(未登録時は空配列。passwordタイプの項目も含む)
                          List of keys contained in the credential data (an empty array when not registered; includes password-type keys too)
                      credential_data:
                        type: object
                        description: |-
                          settingsでtype: password以外と定義されている項目のみ、実際の値を含む
                          (passwordタイプの項目は含まない。未登録時は空オブジェクト)
                          Contains actual values only for entries whose settings type is not "password"
                          (password-type entries are omitted; an empty object when not registered)
                        example:
                          accessKeyId: "ASIA..."
                          region: "ap-northeast-1"
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

put:
  tags:
    - UsersService
  summary: Credentialを更新
  description: このcredential_typeに登録済みのCredentialを全体更新する(部分更新ではない)。
  operationId: update_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - credential_name
            - credential_data
          properties:
            credential_name:
              type: string
              description: Credential名
            credential_data:
              type: object
              description: Credentialデータ(キー名はGET /ai-servicesのsettingsで定義される)
            notes:
              type: string
              description: 備考(任意)
        examples:
          update_cache:
            summary: キャッシュファイルを更新(bedrock-cache)
            value:
              credential_name: "AWS Login Cache"
              credential_data:
                apiKey: "{\"idToken\":\"...\",\"accessToken\":\"...\",\"refreshToken\":\"...\",\"region\":\"ap-northeast-1\"}"
          update_manual:
            summary: アクセスキーを更新(bedrock)
            value:
              credential_name: "My Bedrock Credential"
              credential_data:
                accessKeyId: "ASIA..."
                secretAccessKey: "..."
                sessionToken: "..."
  responses:
    200:
      description: 更新成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_id:
                        type: string
                      credential_type:
                        type: string
                      credential_name:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
    400:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    404:
      description: |
        このcredential_typeでCredentialが未登録(更新対象なし。先にPOSTで登録する)
        No credential is registered for this credential_type (nothing to update; register one with POST first)
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'

delete:
  tags:
    - UsersService
  summary: Credentialを削除
  description: |-
    このcredential_typeに登録されているCredentialを削除する。
    認証情報が無くなったAIサービスの設定を残さないため、あわせて/{ai_service_id}/ai-preferenceのAI利用設定も削除し、
    このAIサービスを使用中だった場合は/ai-preferenceの現在選択中のAIサービスも未選択に戻す。
  operationId: delete_credential
  x-openapi-router-controller: controllers.users_service_controller
  parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: string
    - name: credential_type
      in: path
      required: true
      schema:
        type: string
        enum: [bedrock-cache, bedrock]
  responses:
    200:
      description: 削除成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/responseOk.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      credential_type:
                        type: string
                      current_ai_service_cleared:
                        type: boolean
                        description: 削除したAIサービスを使用中だったため、現在選択中のAIサービスを未選択に戻したかどうか
                        example: true
                      message:
                        type: string
    404:
      description: このcredential_typeでCredentialが未登録
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
    default:
      description: An unexpected error response.
      content:
        application/json:
          schema:
            $ref: '../schemas/runtimeError.yaml'
