components:
  schemas:
    responseOk:
      title: A successful base response.
      type: object
      properties:
        result:
          type: integer
          example: 200
        message:
          type: string
          example: SUCCESS
        ts:
          type: string
          format: date-time
    responseStat:
      type: object
      properties:
        create_timestamp:
          type: string
          format: date-time
        create_user:
          type: string
        last_update_timestamp:
          type: string
          format: date-time
        last_update_user:
          type: string
    runtimeError:
      type: object
      properties:
        result:
          type: integer
          format: int32
          example: 500
        message:
          type: string
          example: Error Message
        ts:
          type: string
          format: date-time
        data:
          type: object
          example: null
    runtimeErrorConflict:
      type: object
      properties:
        result:
          type: integer
          format: int32
          example: 409
        message:
          type: string
          example: Error Message
        ts:
          type: string
          format: date-time
        data:
          type: object
          example: null
    organization:
      title: organization is a definition of Organization resource.
      type: object
      properties:
        id:
          type: string
          example: org1
        name:
          type: string
          example: name of org1
        organization_managers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              username:
                type: string
              name:
                type: string
                example: firstname lastname
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
              enabled:
                type: boolean
              create_timestamp:
                type: string
                format: date-time
        active_plan:
          type: object
          properties:
            id:
              type: string
              example: plan-1
        plans:
          type: array
          items:
            $ref: '#/components/schemas/planMappingOrganization'
        enabled:
          type: boolean
          description: organization enabled(true) or disabled(false)
          example: true
        optionsIta:
          type: object
          properties:
            drivers:
              type: object
              properties:
                terraform_cloud_ep:
                  type: boolean
                terraform_cli:
                  type: boolean
                ci_cd:
                  type: boolean
                oase:
                  type: boolean
                ai_assistant:
                  type: boolean
        status:
          type: string
          example: Organization Create Complete
    organizationCreate:
      title: organization is a definition of Organization resource.
      type: object
      properties:
        id:
          type: string
          example: org1
        name:
          type: string
          example: organization of org1
        organization_managers:
          type: array
          items:
            $ref: '#/components/schemas/organizationUserCreate'
        plan:
          type: object
          properties:
            id:
              type: string
              example: plan-1
        options:
          type: object
          description: Organization Add Json Parameter (json of KeyCloak)
        optionsIta:
          type: object
          description: Organization Add Json Parameter (json of exastro-it-automation)
          properties:
            drivers:
              type: object
              description: 'terraform_cloud_ep: Terraform-Cloud/EP driver <br/>terraform_cli: Terraform-CLI driver, <br/>ci_cd: CI/CD for IaC, <br/>oase: OASE, <br/>ai_assistant: Exastro AI Assistant, '
              properties:
                terraform_cloud_ep:
                  type: boolean
                terraform_cli:
                  type: boolean
                ci_cd:
                  type: boolean
                oase:
                  type: boolean
                ai_assistant:
                  type: boolean
            services:
              type: object
              properties:
                document_store:
                  type: object
                  description: Only supports mongodb.
                  properties:
                    name:
                      type: string
                      example: mongodb
                    owner:
                      type: boolean
                    connection_string:
                      type: string
                      example: XXXXXXXXXXXXXXXX
      required:
        - id
    organizationUserCreate:
      title: organization-user is a definition of User resource.
      type: object
      properties:
        username:
          type: string
          example: user-id
        email:
          type: string
          example: user e-mail address
        firstName:
          type: string
        lastName:
          type: string
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/userCredentials'
