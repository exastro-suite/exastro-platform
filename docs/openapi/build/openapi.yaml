openapi: 3.0.3
info:
  title: Exastro Platform API
  description: Exastro Platform API
  version: 2.10.0
servers:
  - url: 'https://{host}'
    description: API endpoint
    variables:
      host:
        default: localhost
  - url: 'http://{host}'
    description: API endpoint
    variables:
      host:
        default: localhost
  - url: '{protocol}://{host}:{port}'
    description: API endpoint (Development)
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
      host:
        default: localhost
      port:
        default: '30080'
tags:
  - name: OrganizationService
    description: オーガナイゼーションに関する操作
  - name: TokenService
    description: tokenに関する操作
  - name: PlanService
    description: プランに関する操作
  - name: UsageService
    description: リソース使用量に関する操作
  - name: WorkspaceService
    description: ワークスペースに関する操作
  - name: UsersService
    description: ユーザーに関する操作
  - name: RoleService
    description: ロールに関する操作
  - name: RoleMappingsService
    description: ロール・マッピングに関する操作
  - name: JobsService
    description: ジョブに関する操作
  - name: CommonService
    description: システム設定に関する操作
  - name: MaintenanceModeService
    description: メンテナンスモードに関する操作
  - name: NotificationService
    description: 通知機能に関する操作
  - name: NotificationJobService
    description: 通知ジョブに関する操作
  - name: MailserverSettings
    description: メールサーバーに関する操作
  - name: AuditLogService
    description: 監査ログに関する操作
  - name: ServiceAccountUsersService
    description: サービスアカウントユーザーに関する操作
  - name: AIAssistantService
    description: AIアシスタントに関する操作
  - name: InternalCommonService
    description: 共通(内部用)
  - name: InternalPlanService
    description: プランに関する操作(内部用)
  - name: InternalUsersService
    description: ユーザーに関する操作(内部用)
  - name: InternalWorkspaceService
    description: ワークスペースに関する操作(内部用)
  - name: InternalMaintenanceModeService
    description: メンテナンスモードに関する操作(内部用)
  - name: InternalNotificationService
    description: 通知機能に関する操作(内部用)
  - name: InternalNotificationJobService
    description: 通知ジョブに関する操作(内部用)
  - name: InternalHealthCheckService
    description: ヘルスチェックに関する操作(内部用)
  - name: InternalServiceAccountUsersService
    description: サービスアカウントユーザーに関する操作(内部用)
paths:
  /api/platform/organizations:
    get:
      tags:
        - OrganizationService
      summary: List returns list of organization
      x-openapi-router-controller: controllers.organization_service_controller
      operationId: organization_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - $ref: '#/components/schemas/organizationList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    post:
      tags:
        - OrganizationService
      summary: Create creates an organization
      x-openapi-router-controller: controllers.organization_service_controller
      operationId: organization_create
      parameters:
        - name: retry
          in: query
          schema:
            type: string
            description: \"1\" is retry organization create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/organizationCreate'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseOk'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  '/api/platform/organizations/{organization_id}':
    get:
      tags:
        - OrganizationService
      summary: get organization
      x-openapi-router-controller: controllers.organization_service_controller
      operationId: organization_get
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/organization'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    put:
      tags:
        - OrganizationService
      summary: update an organization
      x-openapi-router-controller: controllers.organization_service_controller
      operationId: organization_update
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - title: organization is a definition of Organization resource.
                  type: object
                  properties:
                    name:
                      type: string
                      example: name of org1
                    enabled:
                      type: boolean
                      description: organization enabled(true) or disabled(false)
                      example: true
                    optionsIta:
                      type: object
                      description: Organization Add Json Parameter (json of exastro-it-automation)
                      properties:
                        drivers:
                          type: object
                          description: 'terraform_cloud_ep: Terraform-Cloud/EP driver <br/>terraform_cli: Terraform-CLI driver, <br/>ci_cd: CI/CD for IaC, <br/>oase: OASE, <br/>ai_assistant: Exastro AI Assistant, '
                          properties:
                            terraform_cloud_ep:
                              type: boolean
                            terraform_cli:
                              type: boolean
                            ci_cd:
                              type: boolean
                            oase:
                              type: boolean
                            ai_assistant:
                              type: boolean
                          required:
                            - terraform_cloud_ep
                            - terraform_cli
                            - ci_cd
                            - oase
                            - ai_assistant
                        services:
                          type: object
                          properties:
                            document_store:
                              type: object
                              description: Only supports mongodb.
                              properties:
                                name:
                                  type: string
                                  example: mongodb
                                owner:
                                  type: boolean
                                connection_string:
                                  type: string
                                  example: XXXXXXXXXXXXXXXX
                      required:
                        - drivers
                  required:
                    - name
                    - enabled
                    - optionsIta
            examples:
              organization:
                value:
                  name: name of org1
                  enabled: true
                  optionsIta:
                    drivers:
                      terraform_cloud_ep: true
                      terraform_cli: true
                      ci_cd: true
                      oase: true
                      ai_assistant: true
                    services:
                      document_store:
                        name: mongodb
                        owner: true
                        connection_string: XXXXXXXXXXXXXXXX
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        example: null
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
        - OrganizationService
      summary: Delete an organization
      x-openapi-router-controller: controllers.organization_service_controller
      operationId: organization_delete
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  '/api/{organization_id}/platform/setting':
    get:
      tags:
        - OrganizationService
      summary: get an organization settings
      x-openapi-router-controller: controllers.organization_service_controller
      operationId: organization_setting_get
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/organizationSetting'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    patch:
      tags:
        - OrganizationService
      summary: Update an organization settings
      x-openapi-router-controller: controllers.organization_service_controller
      operationId: organization_setting_update
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/organizationSetting'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseOk'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  '/auth/realms/{organization_id}/protocol/openid-connect/token':
    post:
      tags:
        - TokenService
      summary: create token
      x-openapi-router-controller: controllers.token_service_controller
      operationId: token_create
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/tokenRequestBody'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponseOK'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponseError'
  '/api/{organization_id}/platform/users/_current/refresh_tokens':
    get:
      tags:
        - TokenService
      summary: List returns refresh token
      x-openapi-router-controller: controllers.token_service_controller
      operationId: refresh_token_list
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - $ref: '#/components/schemas/tokenRefreshList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
        - TokenService
      summary: delete refresh token
      x-openapi-router-controller: controllers.token_service_controller
      operationId: refresh_token_delete
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        example: null
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /api/platform/users/_current/refresh_tokens:
    get:
      tags:
        - TokenService
      summary: List returns refresh token for system manager
      x-openapi-router-controller: controllers.token_service_controller
      operationId: refresh_token_list_for_mng
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - $ref: '#/components/schemas/tokenRefreshList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
        - TokenService
      summary: delete refresh token for system manager
      x-openapi-router-controller: controllers.token_service_controller
      operationId: refresh_token_delete_for_mng
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        example: null
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  '/api/platform/{organization_id}/plans':
    get:
      tags:
