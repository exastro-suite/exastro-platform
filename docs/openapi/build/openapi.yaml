          in: path
          required: true
          schema:
            type: string
        - name: limit_id
          in: query
          description: filter limit id. (prefix match)
          schema:
            type: string
            example: platform.workspaces
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - $ref: '#/components/schemas/limits'
        default:
