                            type: boolean
                            description: 削除したAIサービスを使用中だったため、現在選択中のAIサービスを未選択に戻したかどうか
                            example: true
                          message:
                            type: string
        '404':
          description: このcredential_typeでCredentialが未登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
