      description: |-
        ユーザーの、このAIサービス(ai_service_id)向けのAI利用設定を全置換で保存する。model_idは必須で、指定した内容にそのまま置き換わる（部分更新ではない）。
        Save the user's AI preference for this AI service (ai_service_id) as a full replacement. model_id is required, and the stored content is entirely replaced with what is specified (not a partial update).
      operationId: update_ai_preference
      x-openapi-router-controller: controllers.users_service_controller
