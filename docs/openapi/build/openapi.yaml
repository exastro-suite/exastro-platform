          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /api/platform/plans:
    get:
      tags:
        - PlanService
      summary: List returns list of plans
      x-openapi-router-controller: controllers.plan_service_controller
      operationId: plan_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/responseOk'
                  - $ref: '#/components/schemas/planList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    post:
      tags:
        - PlanService
      summary: Create creates an plan
      x-openapi-router-controller: controllers.plan_service_controller
      operationId: plan_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/plan'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseOk'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /api/platform/plan_items:
    get:
      tags:
        - PlanService
      summary: List returns list of plan items
      x-openapi-router-controller: controllers.plan_service_controller
      operationId: plan_item_list
