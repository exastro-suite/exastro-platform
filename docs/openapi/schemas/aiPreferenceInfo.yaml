type: object
properties:
  ai_service_id:
    type: string
    description: |-
      AIサービスID(パスパラメータの値をそのまま返す)
      AI service ID (echoes the path parameter value)
    enum: [bedrock-cache, bedrock]
    example: "bedrock-cache"
  ai_service_name:
    type: string
    nullable: true
    readOnly: true
    description: |-
      AIサービスの表示名(ai_service_idからサーバー側で導出。取得時のみ付与され、未知のIDの場合はnull)
      Display name of the AI service (derived server-side from ai_service_id at GET time; null if the ID is unrecognized)
    example: "Amazon Bedrock (Login Cache)"
  model_id:
    type: string
    nullable: true
    description: |-
      デフォルトで使用するモデルID(一度も保存していない場合はnull)
      Default model ID to use (null if never saved)
    example: "anthropic.claude-3-5-sonnet-20240620-v1:0"
  model_name:
    type: string
    nullable: true
    description: |-
      デフォルトモデルの表示名(PUT時にクライアントが指定した値をそのまま保存・返却。未指定または未保存の場合はnull)
      Display name of the default model (stored/returned verbatim as supplied by the client at PUT time; null if not provided or never saved)
    example: "Claude 3.5 Sonnet"
  pickup_model_ids:
    type: array
    description: |-
      UIでモデル選択の候補を絞り込むためにピックアップしたモデル一覧(選択肢が多すぎる問題への対処用)。
      IDだけでは表示名がわからず使いにくいため、id・nameを持つオブジェクトの配列とする
      List of models picked to narrow down the model choices shown in the UI (addresses having too many models to choose from).
      An array of objects with id and name (an ID alone is hard to use for display purposes)
    items:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: |-
            モデルID
            Model ID
        name:
          type: string
          nullable: true
          description: |-
            表示用のモデル名(任意)
            Display name for the model (optional)
    example:
      - id: "anthropic.claude-3-5-sonnet-20240620-v1:0"
        name: "Claude 3.5 Sonnet"
      - id: "global.anthropic.claude-sonnet-5"
        name: "Claude Sonnet 5"
