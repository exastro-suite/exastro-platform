type: object
properties:
  credential_id:
    type: string
  credential_type:
    type: string
    enum: [bedrock-cache, bedrock]
  credential_name:
    type: string
  status:
    type: string
    enum: [active, expired, disabled]
  expires_at:
    type: string
    format: date-time
  last_validated_at:
    type: string
    format: date-time
  last_used_at:
    type: string
    format: date-time
  validation_error:
    type: string
  notes:
    type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
