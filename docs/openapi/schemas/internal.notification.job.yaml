title: Notification job data (Internal).
type: object
properties:
  id:
    type: string
    description: Notification ID (ULID format)
  destination_id:
    type: string
    description: Destination ID
  destination_name:
    type: string
    description: Destination name
  destination_kind:
    type: string
    enum: [Mail, Teams_WF, Teams, Webhook, ServiceNow]
    description: Notification method
  func_id:
    type: string
    description: Function ID
  func_informations:
    type: object
    description: Function information details
  message_informations:
    type: object
    description: Notification message content
  notification_status:
    type: string
    enum: [Unsent, Successful, Failed, AbortedExpired]
    description: Notification status
  notification_timestamp:
    type: string
    format: date-time
    description: Notification sent timestamp
    nullable: true
  http_response_code:
    type: integer
    description: HTTP response code
    nullable: true
  http_response_body:
    type: string
    description: HTTP response body
    nullable: true
  enable_retry:
    type: boolean
    description: Whether retry is enabled
  retry_count_limit:
    type: integer
    description: Retry count limit
    nullable: true
  retry_count:
    type: integer
    description: Current retry count
  create_timestamp:
    type: string
    format: date-time
    description: Creation timestamp
  create_user:
    type: string
    description: Creator user ID
  last_update_timestamp:
    type: string
    format: date-time
    description: Last update timestamp
  last_update_user:
    type: string
    description: Last update user ID
