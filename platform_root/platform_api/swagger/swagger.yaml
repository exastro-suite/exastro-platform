      x-openapi-router-controller: controllers.common_service_controller
  /api/{organization_id}/platform/users/_current/{credential_type}/credentials:
    get:
      tags:
      - UsersService
      summary: Credentialを取得
      description: |
        このcredential_typeに登録されているCredentialを取得する(1credential_typeにつき1件のみ)。
        credential_dataのうち、GET /ai-servicesのsettingsでtype: password以外と定義されている項目のみ
        値を返す(passwordタイプの項目は値を返さずマスクする)。未登録の場合も404にはせず、
        credential_id等がnullの状態で200を返す。
      operationId: get_credential
      parameters:
      - name: organization_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: credential_type
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - bedrock-cache
          - bedrock
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_14"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runtimeError"
      x-openapi-router-controller: controllers.users_service_controller
    put:
      tags:
      - UsersService
      summary: Credentialを更新
      description: このcredential_typeに登録済みのCredentialを全体更新する(部分更新ではない)。
      operationId: update_credential
      parameters:
      - name: organization_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: credential_type
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - bedrock-cache
          - bedrock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/credential_type_credentials_body"
            examples:
              update_cache:
                summary: キャッシュファイルを更新(bedrock-cache)
                value:
                  credential_name: AWS Login Cache
                  credential_data:
                    apiKey: "{\"idToken\":\"...\",\"accessToken\":\"...\",\"refreshToken\"\
                      :\"...\",\"region\":\"ap-northeast-1\"}"
              update_manual:
                summary: アクセスキーを更新(bedrock)
                value:
                  credential_name: My Bedrock Credential
                  credential_data:
                    accessKeyId: ASIA...
                    secretAccessKey: '...'
                    sessionToken: '...'
        required: true
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_15"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runtimeError"
        "404":
          description: |
            このcredential_typeでCredentialが未登録(更新対象なし。先にPOSTで登録する)
            No credential is registered for this credential_type (nothing to update; register one with POST first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runtimeError"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runtimeError"
      x-openapi-router-controller: controllers.users_service_controller
    post:
      tags:
      - UsersService
      summary: Credentialを登録
      description: 外部サービスのCredentialを登録する
      operationId: register_credential
      parameters:
      - name: organization_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: credential_type
        in: path
        description: |
          Credentialタイプ
          - bedrock-cache: AWS Login Cache (自動トークン更新、credential_data: {"apiKey": "<キャッシュファイル全体のJSON文字列>"})
          - bedrock: AWS Bedrock (手動Credential登録)
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - bedrock-cache
          - bedrock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/credential_type_credentials_body_1"
        required: true
      responses:
        "200":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_15"
        "400":
