openapi: 3.0.3
info:
  title: Exastro Platform API
  description: Exastro Platform API
  version: 2.10.0
servers:
- url: "https://{host}"
  description: API endpoint
  variables:
    host:
      default: localhost
- url: "http://{host}"
  description: API endpoint
  variables:
    host:
      default: localhost
- url: "{protocol}://{host}:{port}"
  description: API endpoint (Development)
  variables:
    protocol:
      default: https
      enum:
      - http
      - https
    host:
      default: localhost
    port:
      default: "30080"
# security:
# - BearerAuth: []
# - BasicAuth: []
tags:
- name: OrganizationService
  description: オーガナイゼーションに関する操作
- name: TokenService
  description: tokenに関する操作
- name: PlanService
  description: プランに関する操作
- name: UsageService
  description: リソース使用量に関する操作
- name: WorkspaceService
  description: ワークスペースに関する操作
- name: UsersService
  description: ユーザーに関する操作
- name: RoleService
  description: ロールに関する操作
- name: RoleMappingsService
  description: ロール・マッピングに関する操作
- name: JobsService
  description: ジョブに関する操作
- name: CommonService
  description: システム設定に関する操作
- name: MaintenanceModeService
  description: メンテナンスモードに関する操作
- name: NotificationService
  description: 通知機能に関する操作
- name: NotificationJobService
  description: 通知ジョブに関する操作
- name: MailserverSettings
  description: メールサーバーに関する操作
- name: AuditLogService
  description: 監査ログに関する操作
- name: ServiceAccountUsersService
  description: サービスアカウントユーザーに関する操作
- name: AIAssistantService
  description: AIアシスタントに関する操作
- name: InternalCommonService
  description: 共通(内部用)
- name: InternalPlanService
  description: プランに関する操作(内部用)
- name: InternalUsersService
  description: ユーザーに関する操作(内部用)
- name: InternalWorkspaceService
  description: ワークスペースに関する操作(内部用)
- name: InternalMaintenanceModeService
  description: メンテナンスモードに関する操作(内部用)
- name: InternalNotificationService
  description: 通知機能に関する操作(内部用)
- name: InternalNotificationJobService
  description: 通知ジョブに関する操作(内部用)
- name: InternalHealthCheckService
  description: ヘルスチェックに関する操作(内部用)
- name: InternalServiceAccountUsersService
  description: サービスアカウントユーザーに関する操作(内部用)
paths:
  /api/platform/organizations:
    get:
      tags:
      - OrganizationService
      summary: List returns list of organization
      operationId: organization_list
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runtimeError"
      x-openapi-router-controller: controllers.organization_service_controller
    post:
      tags:
      - OrganizationService
      summary: Create creates an organization
      operationId: organization_create
      parameters:
      - name: retry
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: \"1\" is retry organization create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/organizationCreate"
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseOk"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runtimeError"
      x-openapi-router-controller: controllers.organization_service_controller
  /api/platform/organizations/{organization_id}:
    get:
      tags:
      - OrganizationService
      summary: get organization
      operationId: organization_get
      parameters:
      - name: organization_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/runtimeError"
      x-openapi-router-controller: controllers.organization_service_controller
