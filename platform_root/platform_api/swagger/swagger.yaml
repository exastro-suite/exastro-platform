                  enabled: true
                  optionsIta:
                    drivers:
                      terraform_cloud_ep: true
                      terraform_cli: true
                      ci_cd: true
                      oase: true
                      ai_assistant: true
                    services:
                      document_store:
                        name: mongodb
                        owner: true
                        connection_string: XXXXXXXXXXXXXXXX
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
