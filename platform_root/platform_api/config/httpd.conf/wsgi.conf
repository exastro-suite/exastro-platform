WSGISocketPrefix ${APACHE_SOCKET_DIR}/wsgi

# NOTE:
# - 通常系は既存の platform-api グループを利用
# - 生成AIサービス(Bedrock)の応答待ちで長時間スレッドを占有しやすいAIアシスタント系のAPIを別グループへ分離する
#   (認証情報系のAPIは分離せず通常系のまま)
#
# 値(processes/threads)は初期値例です。環境(CPU/メモリ/通常系RPS)に応じて調整してください。
WSGIDaemonProcess platform-api locale=C.UTF-8 processes=${PLATFORM_API_WSGI_PROCESSES} threads=${PLATFORM_API_WSGI_THREADS} display-name=%{GROUP}

# AIアシスタントの分離
#   - /api/{organization_id}/platform/ai-services
#   - /api/{organization_id}/platform/workspaces/{workspace_id}/conversations 配下(completions含む)
#   - /api/{organization_id}/platform/workspaces/{workspace_id}/lessons 配下
WSGIDaemonProcess platform-api-ai-assistant locale=C.UTF-8 processes=${AI_ASSISTANT_WSGI_PROCESSES} threads=${AI_ASSISTANT_WSGI_THREADS} display-name=%{GROUP}
WSGIScriptAliasMatch "^(/api/[^/]+/platform/ai-services)$" /app/application.wsgi$1 process-group=platform-api-ai-assistant
WSGIScriptAliasMatch "^(/api/[^/]+/platform/workspaces/[^/]+/(conversations|lessons)(/.*)?)$" /app/application.wsgi$1 process-group=platform-api-ai-assistant

WSGIProcessGroup platform-api
WSGIScriptAlias / /app/application.wsgi process-group=platform-api
WSGIPassAuthorization On
# サブインタプリタではなくメインインタプリタで実行する
# (awscrt等のネイティブ拡張がサブインタプリタ上でGILデッドロックを起こし、deadlock-timeoutでデーモンが強制終了されるため)
WSGIApplicationGroup %{GLOBAL}

<VirtualHost *:${LISTEN_PORT}>

    <Directory /app >
        Require all granted
    </Directory>

    ErrorLogFormat "%M"
    ErrorLog /dev/stdout

    # Exclude from access log
    SetEnvIf Request_URI "^/internal-api/" no_log

    CustomLog /dev/stdout combined env=!no_log
    # TransferLog /dev/stdout
    LogLevel warn

    <Location /api/ >
        ProxyPass !
        ProxyPassReverse !
        Require all granted
    </Location>
    <Location /internal-api/ >
        ProxyPass !
        ProxyPassReverse !
        Require all granted
    </Location>
</VirtualHost>
